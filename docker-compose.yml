services:
  user-mongodb:
    image: mongo:7.0.14
    container_name: user-service-mongodb
    ports:
      - "27017:27017"
    volumes:
      - user_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  product-mongodb:
    image: mongo:7.0.14
    container_name: product-service-mongodb
    ports:
      - "27018:27017"
    volumes:
      - product_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    build:
      context: ./backend/userservice
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://user-mongodb:27017/user-service-db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
    depends_on:
      user-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  product-service:
    build:
      context: ./backend/productservice
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_MONGODB_URI: mongodb://product-mongodb:27017/product-service-db
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
    depends_on:
      product-mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-is-long-enough}
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buy-01-frontend
    ports:
      - "4200:4200"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  user_mongodb_data:
  product_mongodb_data:
  media_mongodb_data:
  media_object_storage_data:
