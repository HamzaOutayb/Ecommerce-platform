<section class="catalog">
  <div class="section-title"><p class="eyebrow">CATALOGUE</p><h2>Latest listings</h2></div>
  <p class="error" *ngIf="error">{{ error }}</p>
  <div class="products">
    <article *ngFor="let item of products">
      <img *ngIf="item.imagePaths?.length" [src]="item.imagePaths?.[0]" [alt]="item.name">
      <span class="dot" *ngIf="!item.imagePaths?.length">No image</span>
      <h3>{{ item.name }}</h3><p>{{ item.description }}</p><strong>{{ item.price | currency }}</strong><small>{{ item.quantity }} available</small>
    </article>
  </div>
</section>
