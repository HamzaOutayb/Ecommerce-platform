<section class="profile">

  <div class="section-header">
    <p class="eyebrow">ACCOUNT</p>
    <h2>Profile</h2>
  </div>

  <form class="profile-form" (ngSubmit)="save()">
    <label>
      Display name
      <input [(ngModel)]="name" name="name" placeholder="Your name" required>
    </label>
    <label>
      Email
      <input [ngModel]="email" name="email" type="email" readonly>
    </label>
    <label>
      Avatar URL
      <input [(ngModel)]="avatar" name="avatar" placeholder="https://…">
    </label>
    <button type="submit" class="btn-primary">Update profile</button>
  </form>

  <p class="msg-error" *ngIf="error">{{ error }}</p>
  <p class="msg-success" *ngIf="successMessage">{{ successMessage }}</p>

</section>
