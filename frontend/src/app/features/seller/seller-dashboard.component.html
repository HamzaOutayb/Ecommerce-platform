<section class="seller">

  <div class="section-header">
    <p class="eyebrow">SELLER DESK</p>
    <h2>{{ isEditing ? 'Edit listing' : 'Publish a listing' }}</h2>
  </div>

  <form class="product-form" (ngSubmit)="save()">

    <!-- ── Basic fields ──────────────────────────────────────── -->
    <label>
      Product name *
      <input [(ngModel)]="draft.name" name="name" placeholder="e.g. Wireless headphones" maxlength="100" required>
    </label>

    <label>
      Price (USD) *
      <input [(ngModel)]="draft.price" name="price" type="number" min="0.01" step="0.01" placeholder="0.00" required>
    </label>

    <label>
      Quantity *
      <input [(ngModel)]="draft.quantity" name="quantity" type="number" min="0" step="1" placeholder="0" required>
    </label>

    <label class="span-2">
      Description
      <textarea [(ngModel)]="draft.description" name="description" placeholder="Describe your product…" maxlength="1000" rows="3"></textarea>
    </label>

    <!-- ── Image upload ──────────────────────────────────────── -->
    <div class="image-section span-2">
      <p class="image-label">Images <span class="muted">(up to 5)</span></p>

      <!-- Preview grid -->
      <div class="preview-grid" *ngIf="previews.length > 0">
        <div class="preview-item" *ngFor="let src of previews; let i = index">
          <img [src]="src" alt="Preview {{ i + 1 }}">
          <button type="button" class="remove-btn" (click)="removeFile(i)" title="Remove image">✕</button>
        </div>
      </div>

      <!-- File picker — only show when fewer than 5 images are staged -->
      <label class="file-picker" *ngIf="previews.length < 5">
        <input
          type="file"
          accept="image/*"
          multiple
          (change)="onFilesSelected($event)"
          style="display: none;">
        <span class="file-picker-btn">＋ Add images</span>
        <span class="muted" *ngIf="previews.length > 0">{{ previews.length }} / 5 selected</span>
      </label>
    </div>

    <!-- ── Actions ───────────────────────────────────────────── -->
    <div class="btn-row span-2">
      <button type="submit" class="btn-primary" [disabled]="saving">
        <span *ngIf="uploadingImages">Uploading images…</span>
        <span *ngIf="saving && !uploadingImages">Saving…</span>
        <span *ngIf="!saving">{{ isEditing ? 'Save changes' : 'Publish product' }}</span>
      </button>
      <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
    </div>

  </form>

  <p class="msg-error" *ngIf="error">{{ error }}</p>

</section>

<!-- ── Toast notification ─────────────────────────────── -->
<div class="toast toast-success" *ngIf="successMessage">
  <span class="toast-icon">✓</span>
  {{ successMessage }}
</div>
