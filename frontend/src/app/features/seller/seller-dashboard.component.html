<section class="seller">
  <p class="eyebrow">SELLER DESK</p>
  @if (editingId) {
    <h2>Edit listing</h2>
  } @else {
    <h2>Publish a listing</h2>
  }
  <div class="form-grid"><input [(ngModel)]="product.name" placeholder="Product name"><input [(ngModel)]="product.price" type="number" min="0" placeholder="Price"><input [(ngModel)]="product.quantity" type="number" min="0" placeholder="Quantity"><input [(ngModel)]="product.description" placeholder="Description"></div>
  @if (editingId) {
    <button class="primary" (click)="save()">Save changes</button>
    <button (click)="reset()">Cancel</button>
  } @else {
    <button class="primary" (click)="save()">Publish product</button>
  }
  <div class="seller-products"><h3>Your products</h3><div *ngFor="let item of products" class="seller-product"><span>{{ item.name }}</span><div><button (click)="edit(item)">Edit</button><button (click)="remove(item.id)">Delete</button></div></div></div>
  <div class="media-tools"><label>Product image <input type="file" accept="image/jpeg,image/png,image/webp" (change)="chooseFile($event)"></label><select [(ngModel)]="selectedProductId"><option value="">Select product</option><option *ngFor="let item of products" [value]="item.id">{{ item.name }}</option></select><button (click)="upload()">Upload image</button></div>
  <div class="seller-media" *ngFor="let item of products"><h3>{{ item.name }} images</h3><div class="media-item" *ngFor="let image of media[item.id]"><img [src]="image.imagePath" [alt]="item.name"><button (click)="deleteMedia(image.id, item.id)">Delete image</button></div></div>
  <p class="error" *ngIf="error">{{ error }}</p><p class="message" *ngIf="message">{{ message }}</p>
</section>
