<section class="seller">
  <div class="section-header">
    <p class="eyebrow">SELLER DESK</p>
    <h2>{{ isEditing ? 'Edit listing' : 'Publish a listing' }}</h2>
  </div>

  <form class="product-form" (ngSubmit)="save()">
    <label>
      Product name
      <input [(ngModel)]="draft.name" name="name" placeholder="e.g. Wireless headphones" maxlength="120" required>
    </label>
    <label>
      Price (USD)
      <input [(ngModel)]="draft.price" name="price" type="number" min="0.01" step="0.01" placeholder="0.00" required>
    </label>
    <label>
      Quantity
      <input [(ngModel)]="draft.quantity" name="quantity" type="number" min="0" step="1" placeholder="0" required>
    </label>
    <label class="span-2">
      Description
      <textarea [(ngModel)]="draft.description" name="description" placeholder="Describe your product…" maxlength="2000" rows="3" required></textarea>
    </label>

    <div class="btn-row">
      <button type="submit" class="btn-primary">{{ isEditing ? 'Save changes' : 'Publish product' }}</button>
      <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
    </div>
  </form>

  <p class="msg-error" *ngIf="error">{{ error }}</p>
  <p class="msg-success" *ngIf="successMessage">{{ successMessage }}</p>
</section>
